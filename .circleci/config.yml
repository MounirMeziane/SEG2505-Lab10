version: 2.1

jobs:
  build-and-test:
    # Docker image from CircleCI with the Android SDK and Java already installed
    docker:
      - image: cimg/android:2026.07
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
    steps:
      # 1. Get the code from GitHub
      - checkout
      # 2. Make the Gradle wrapper executable (the file was committed from Windows)
      - run:
          name: Make gradlew executable
          command: chmod +x gradlew
      # 3. Run all the unit tests
      - run:
          name: Run unit tests
          command: ./gradlew testDebugUnitTest
      # 4. Build the APK
      - run:
          name: Build debug APK
          command: ./gradlew assembleDebug
      # 5. Show the test results and keep the APK in CircleCI
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

workflows:
  build-and-test-workflow:
    jobs:
      - build-and-test